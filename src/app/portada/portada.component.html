<article class="group h-full flex flex-col overflow-hidden rounded-xl bg-white shadow-md hover:shadow-xl hover:-translate-y-1 transition duration-300 border border-stone-200">
  <div class="overflow-hidden">
    <img [src]="personaje().imagen" [alt]="personaje().nombre" loading="lazy" width="400" height="240"
         class="w-full h-44 object-cover group-hover:scale-105 transition-transform duration-300" />
  </div>

  <div class="flex flex-col flex-1 p-4">
    <h3 class="text-xl font-bold group-hover:text-red-800 transition-colors">{{ personaje().nombre }}</h3>
    <p class="italic text-sm text-stone-600">{{ personaje().universo }}</p>
    <p class="mt-3 flex-1">{{ personaje().descripcion }}</p>

    @if (selected()) {
      <app-desplegable [personaje]="personaje()" />
    }

    <button type="button" (click)="onSelectPersonaje()" [attr.aria-expanded]="selected()"
      class="mt-4 self-start px-4 py-2 rounded-lg bg-red-800 text-white hover:bg-red-900 transition-colors">
      {{ selected() ? 'Mostra menys' : 'Més informació' }}
    </button>
  </div>
</article>
